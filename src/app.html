<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
    <script>
      // Anti-FOUC: aplica o tema antes da primeira pintura. Usa a MESMA chave
      // do mode-watcher (`mode-watcher-mode`, valores light | dark | system),
      // para não haver duas fontes de verdade sobre o tema.
      // É inline de propósito; se o CSP for ligado, precisa de nonce
      // (ver docs/HARNESS.md).
      try {
        const stored = localStorage.getItem('mode-watcher-mode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = stored === 'dark' || ((stored === null || stored === 'system') && prefersDark);
        if (dark) document.documentElement.classList.add('dark');
      } catch {
        /* localStorage bloqueado: segue no tema do sistema pelo CSS */
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
