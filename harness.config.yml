# DeepSeek Harness project config — v2
#
# ⚠️ DOCUMENTO CONCEITUAL — o DSH NÃO lê este arquivo.
#
# A configuração real do DSH vem de:
#   - o profile em $DSH_HOME/profiles/<nome>/
#   - a camada do bundle em cordis.patch.yml
#   - os schemas exportados por cada plugin
#
# Este arquivo descreve a INTENÇÃO de operação do harness (papéis,
# gates por risco, limites de sandbox). Os blocos `subagents:`, `hooks:`,
# `sandbox:`, `review:` e `goals:` são documentação de design — nenhum
# deles tem efeito de runtime.
#
# Para o que é executável de verdade, veja:
#   - cordis.patch.yml        → plugins que o bundle monta
#   - .agents/hooks.json      → hooks do bridge (eventos suportados apenas)
#   - .husky/pre-commit|pre-push → gates de commit e de PR
#   - .agents/goals/current.md   → template de critérios de verificação

project:
  name: sveltekit-cloudflare
  root: .
  agent_file: AGENTS.md
  skills_dir: .agents/skills
  goals_dir: .agents/goals

# ------------------------------------------------------------------
# Subagentes — princípio: um rascunha, outro verifica
# ------------------------------------------------------------------
subagents:
  drafter:
    model: deepseek-chat
    tools:
      - edit_file
      - write_file
      - bash
    description: "Implementa a mudança"
    system_prompt: |
      Você implementa mudanças seguindo AGENT.md e as skills carregadas.
      Não declare uma tarefa como concluída: apenas produza o artefato.

  verifier:
    model: deepseek-chat
    tools:
      - read_file
      - bash
      - grep
    description: "Verifica independentemente. Não confia no drafter."
    system_prompt: |
      Você é um verificador independente. Nunca assuma que o drafter está
      correto. Execute os testes, leia o código com atenção, procure por
      testes reescritos para passar, CI enfraquecido, validação faltando,
      secrets hardcoded e input não confiável indo para LLM.
      Reporte discrepâncias com evidências (comando + saída).

  judge:
    model: deepseek-reasoner
    tools:
      - read_file
      - read_evidence
    description: "Decide se a tarefa está pronta com base em evidências."
    system_prompt: |
      Você decide se a tarefa pode ser declarada concluída. Baseie-se
      exclusivamente em evidências registradas (saídas de comando,
      screenshots, diffs). Não emita opinião sem evidência.

  security_auditor:
    model: deepseek-chat
    tools:
      - bash
      - read_file
      - grep
    description: "Roda OWASP check e gitleaks."
    system_prompt: |
      Execute scripts/owasp-check.sh e gitleaks. Classifique cada achado
      como bloqueante, aviso ou falso positivo. Nunca ignore um bloqueante.

  complexity_auditor:
    model: deepseek-chat
    tools:
      - bash
      - read_file
    description: "Roda análise de complexidade e duplicação."
    system_prompt: |
      Execute scripts/complexity-check.sh. Reporte funções com complexidade
      acima de 10, arquivos acima de 300 linhas, duplicação acima de 3%,
      dead code e imports não usados.

# ------------------------------------------------------------------
# Hooks
# ------------------------------------------------------------------
hooks:
  PreToolUse:
    - match: "edit_file|write_file|str_replace"
      description: "Ler arquivo, verificar gates, carregar skill relevante."
      run: "./scripts/pre-edit-check.sh $FILE"

  PostToolUse:
    - match: "edit_file|write_file|str_replace"
      description: "Type check + lint + teste focado no arquivo modificado."
      run: "./scripts/post-edit-check.sh $FILE"

  PreCommit:
    - description: "Lint + type check"
      run: "pnpm lint && pnpm check"
    - description: "Secrets scan nos arquivos staged"
      run: "gitleaks protect --staged --redact --config .gitleaks.toml"

  PrePR:
    - description: "Pipeline completo"
      run: "./scripts/verify.sh"
    - description: "Security scan"
      run: "./scripts/security-scan.sh"
    - description: "OWASP Top 10"
      run: "./scripts/owasp-check.sh"
    - description: "Complexidade e redundância"
      run: "./scripts/complexity-check.sh"

  PreDeploy:
    - description: "Verificação completa"
      run: "./scripts/verify.sh"
    - description: "Security scan"
      run: "./scripts/security-scan.sh"

  PreDeployProduction:
    - description: "Security scan obrigatório"
      run: "./scripts/security-scan.sh"
    - description: "OWASP obrigatório"
      run: "./scripts/owasp-check.sh"
    - description: "Aprovação humana obrigatória"
      require_approval: true

  PostDeploy:
    - description: "Smoke test pós-deploy"
      run: "./scripts/smoke-test.sh $ENV"

  UserPromptSubmit:
    - description: "Lembrete de skills e subagentes"
      run: "echo '[DSH] Carregue skill relevante. Use subagente verificador.'"

# ------------------------------------------------------------------
# Goals — verificação por etapa
# ------------------------------------------------------------------
goals:
  verification:
    enabled: true
    criteria_file: .agents/goals/current.md
    require_evidence: true
    require_independent_verification: true
  loops:
    goal:
      enabled: true
      max_attempts: 5
      description: "Critério mensurável, para após N tentativas."
    time:
      enabled: true
      default_interval: 5m
      description: "Verifica PR, CI, issues em intervalo."
    proactive:
      enabled: false
      description: "Triagem agendada. Habilite manualmente por tarefa."

# ------------------------------------------------------------------
# Sandbox — limites de escrita e rede
# ------------------------------------------------------------------
sandbox:
  allowed_write_paths:
    - "src/"
    - "workers/"
    - "tests/"
    - "migrations/"
    - "scripts/"
    - ".agents/skills/"
    - ".agents/goals/"
    - "docs/"
  deny_write_paths:
    - ".env"
    - ".env.*"
    - "wrangler.toml"
    - "wrangler.production.toml"
    - ".github/workflows/deploy-production.yml"
    - ".gitleaks.toml"
  network: false
  allow_shell: true
  allow_git: true

# ------------------------------------------------------------------
# Camadas de revisão por risco (Agentic Code Review)
# ------------------------------------------------------------------
review:
  tiers:
    fast:
      when: "PR < 100 linhas e não toca auth, DB, AI Gateway"
      action: "revisão leve"
    normal:
      when: "PR < 400 linhas e não toca auth"
      action: "revisão normal"
    heavy:
      when: "toca auth, schema D1, AI Gateway ou R2"
      action: "revisão pesada + security_auditor"
    critical:
      when: "deploy prod ou migração D1"
      action: "revisão humana obrigatória + approval gate"
  red_flags:
    - "testes reescritos para passar"
    - "CI enfraquecido (lint removido, coverage reduzido)"
    - "helper duplicado já existente"
    - "input não confiável indo para LLM"
    - "PR > 1000 linhas sem justificativa"
    - "PR sem descrição de intenção"
