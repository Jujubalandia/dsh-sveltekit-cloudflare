# ==============================================================
# DSH Bundle Patch — SvelteKit + Cloudflare Harness (sveflare)
#
# Camada de configuração que o DSH aplica quando o bundle entra em
# `dsh.profile.bundles`.
#
# Dialeto: array YAML de entradas de patch do loader
# (`@deepseek-ai/cordis-plugin-include`). Só existem duas formas:
#
#   - insert: [ {id, name, config} ]   → ADICIONA linhas novas
#   - id: <row-existente> + config     → SOBRESCREVE a config da linha
#   - id: <row-existente> + name       → ASSERE o nome da linha alvo
#
# ATENÇÃO: `name` numa entrada de topo (sem `insert`) NÃO adiciona
# plugin nenhum — é uma asserção de que a linha alvo já tem aquele
# nome. Um patch assim, apontando para um `id` que não existe, vira
# um no-op silencioso com o warning "patch: entry ... not found", e o
# bundle parece instalado sem registrar nada.
#
# Rode `node scripts/validate-kit.mjs` para pegar esse caso antes de
# publicar.
#
# Referência: docs/user/develop/basic/publish.md
# ==============================================================

# ------------------------------------------------------------------
# 1. Skills — nenhuma linha é necessária
# ------------------------------------------------------------------
# O `dsh-base` já monta `@deepseek-ai/dsh-skill-filesystem` (id:
# `skill-filesystem`) com `includeDefaultRoots: true`, que descobre
# automaticamente `<projectRoot>/.agents/skills` e
# `<projectRoot>/.dsh/skills`.
#
# Como este kit É o próprio projeto SvelteKit, as 12 skills em
# `.agents/skills/` são registradas pelo provider padrão do DSH — não
# é preciso inserir nem sobrescrever linha alguma aqui.
#
# O que cada skill exige é frontmatter YAML com `name` e
# `description` no topo do SKILL.md. Sem o frontmatter o arquivo é
# ignorado com um warning, e `name` precisa casar com
# /^[a-z0-9]+(?:-[a-z0-9]+)*$/.

# ------------------------------------------------------------------
# 2. Subagentes — nenhuma linha é necessária
# ------------------------------------------------------------------
# O `dsh-base` já monta o seam `@deepseek-ai/dsh-subagent` (id:
# `subagent`) junto de `subagent-spawn-in-process`,
# `subagent-fork-in-process`, `tool-subagent` e `tool-subagent-fork`.
#
# Esse pacote NÃO expõe configuração `agents`: ele é o Service
# Definition do seam (`ctx.subagents`), não um registro de papéis.
# Papéis nomeados no DSH são Agent Presets — um diretório com
# `agent.cordis.yml` descoberto pelos preset roots — e não linhas de
# bundle.

# ------------------------------------------------------------------
# 3. Comandos /sveflare-* — plugin próprio deste bundle
# ------------------------------------------------------------------
# O DSH NÃO varre `.agents/commands/`. O `@deepseek-ai/dsh-commands`
# é um registry em que cada plugin se registra por CÓDIGO, via
# `ctx.commands.register(definition)`; ele não tem schema de
# configuração e nenhum diretório de comandos é descoberto do disco.
#
# Por isso este bundle traz `lib/commands.mjs`, que lê os prompts em
# `.agents/commands/*.md` e os registra como comandos reais.
#
# O nome `./lib/commands.mjs` é resolvido pelo loader relativo a ESTE
# arquivo de patch, então funciona tanto no repo quanto instalado via
# npm.
- insert:
    - id: sveflare-commands
      name: './lib/commands.mjs'
      config:
        commands:
          - name: sveflare-spec
            file: .agents/commands/sveflare-spec.md
          - name: sveflare-plan
            file: .agents/commands/sveflare-plan.md
          - name: sveflare-goal
            file: .agents/commands/sveflare-goal.md
          - name: sveflare-verify
            file: .agents/commands/sveflare-verify.md
          - name: sveflare-ship
            file: .agents/commands/sveflare-ship.md

    # --------------------------------------------------------------
    # 4. Hooks — bridge de hooks do harness
    # --------------------------------------------------------------
    # `@deepseek-ai/dsh-hooks-claude-code` registra hooks de comando
    # nos extension points de interceptação do harness. Ele lê um JSON
    # no formato do Claude Code cujo caminho vem de `configPath`
    # (obrigatório, lido uma única vez no load e resolvido contra o
    # cwd do processo DSH).
    #
    # Eventos suportados pelo bridge: SessionStart, UserPromptSubmit,
    # PreToolUse, PostToolUse, Stop, SubagentStart, SubagentStop.
    #
    # PreCommit e PrePR NÃO são eventos do bridge — eles vivem nos
    # hooks de git em `.husky/pre-commit` e `.husky/pre-push`.
    - id: sveflare-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: './.agents/hooks.json'
