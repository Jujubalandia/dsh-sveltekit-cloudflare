name: CI

# ------------------------------------------------------------------
# Dispara em PRs e pushes na main/develop.
#
# Este repositório é um BUNDLE de harness DSH, não um app SvelteKit
# completo: não há src/, não há pnpm-lock.yaml e o bundle não tem
# etapa de build. Então o CI valida os contratos do bundle, que são
# o que de fato pode quebrar em silêncio:
#
#   1. kit-validate  — package.json, cordis.patch.yml, skills, hooks
#   2. secrets-scan  — gitleaks
#
# Os gates de aplicação (typecheck, lint, testes, e2e) pertencem a um
# projeto que use este kit como scaffold, não a este pacote. Veja a
# seção "Reativando os gates de aplicação" no fim do arquivo.
# ------------------------------------------------------------------

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ================================================================
  # Job 1 — Integridade do bundle
  # ================================================================
  kit-validate:
    name: Validar o bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O validador usa `yaml` quando disponível para checar o
      # cordis.patch.yml de verdade; sem ele degrada para uma
      # checagem estrutural. Instalamos para ter a validação completa.
      #
      # Instalamos num diretório PRÓPRIO, não no root do projeto:
      # `npm install` no root resolve também as devDependencies
      # (SvelteKit + adapter-cloudflare), que hoje conflitam com
      # ERESOLVE — um problema que não tem nada a ver com validar o kit.
      # O symlink é o que a resolução ESM do Node enxerga.
      - name: Instalar dependência de validação (isolada do projeto)
        run: |
          mkdir -p "$RUNNER_TEMP/kitdeps"
          (cd "$RUNNER_TEMP/kitdeps" \
            && npm init -y >/dev/null \
            && npm install --no-save --ignore-scripts yaml)
          mkdir -p node_modules
          ln -sfn "$RUNNER_TEMP/kitdeps/node_modules/yaml" node_modules/yaml
          node -e "import('yaml').then(() => console.log('yaml resolvível a partir do repo')).catch(error => { console.error(error); process.exit(1) })"

      - name: Validar integridade do kit
        run: node scripts/validate-kit.mjs

      - name: Conferir o que vai no pacote npm
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for need in cordis.patch.yml lib/commands.mjs .agents/hooks.json .agents/skills; do
            if ! grep -q "$need" /tmp/pack.txt; then
              echo "❌ '$need' não está no tarball — verifique o campo 'files' do package.json"
              exit 1
            fi
          done
          echo "✅ Todos os artefatos obrigatórios estão no tarball"

  # ================================================================
  # Job 2 — Secrets scan
  # ================================================================
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instalamos o binário direto em vez de usar
      # gitleaks/gitleaks-action@v2: a action falha com
      # "stderr is not empty" em runners recentes, porque trata
      # qualquer warning do Node no stderr como erro fatal.
      # Aqui só o exit code do gitleaks decide.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Escanear o histórico
        run: |
          # `gitleaks git` (subcomando atual) recebe o repositório como
          # argumento POSICIONAL; `--source` só existe no antigo `detect`.
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git . --config .gitleaks.toml --redact --verbose
          else
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose
          fi

  # ================================================================
  # Job 3 — App: install, check, lint, testes e build
  # ================================================================
  app-verify:
    name: App (check, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [kit-validate]

    steps:
      - uses: actions/checkout@v4

      # A versão vem do campo `packageManager` do package.json. Declarar
      # `version` aqui também faz o action falhar com "Multiple versions of
      # pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Testes + cobertura
        run: pnpm test:coverage

      - name: Build (adapter Cloudflare)
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Conferir o artefato do Cloudflare
        run: |
          test -f .svelte-kit/cloudflare/_worker.js
          test -d .svelte-kit/cloudflare/_app
          echo "✅ build do Cloudflare gerado"

  # ================================================================
  # Job 4 — E2E: os 8 componentes do shadcn em navegador real
  # ================================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [app-verify]

    steps:
      - uses: actions/checkout@v4

      # A versão vem do campo `packageManager` do package.json. Declarar
      # `version` aqui também faz o action falhar com "Multiple versions of
      # pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm exec playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ================================================================
  # Job 5 — Gate final
  # ================================================================
  ci-success:
    name: CI success gate
    runs-on: ubuntu-latest
    needs: [kit-validate, secrets-scan, app-verify, e2e]
    if: always()
    steps:
      - name: Verificar status dos jobs obrigatórios
        run: |
          if [ "${{ needs.kit-validate.result }}" != "success" ]; then
            echo "❌ kit-validate falhou"
            exit 1
          fi
          if [ "${{ needs.secrets-scan.result }}" != "success" ]; then
            echo "❌ secrets-scan falhou"
            exit 1
          fi
          if [ "${{ needs.app-verify.result }}" != "success" ]; then
            echo "❌ app-verify falhou"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "❌ e2e falhou"
            exit 1
          fi
          echo "✅ Todos os gates de CI passaram"

# ==================================================================
# Grafo de jobs
# ==================================================================
#   kit-validate ──┬── app-verify ── e2e
#                  └── secrets-scan
#                            │
#                       ci-success (todas precisam passar)
#
# `kit-validate` roda primeiro e é barato: valida o contrato do bundle
# (manifest, dialeto do patch, frontmatter das skills, components.json,
# componentes, dependências pinadas) antes de gastar minutos instalando.
#
# `app-verify` prova que o kit é usável: install, type check, lint, testes
# com cobertura e build do adapter Cloudflare.
#
# `e2e` sobe o build e roda os 8 componentes do shadcn num Chromium real.
